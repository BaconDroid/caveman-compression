version: '3.8'

services:
  caveman-compression:
    build:
      context: .
      args:
        LANGUAGES: ${LANGUAGES:-en,fr}
        CUSTOM_MLM_MODELS: ${CUSTOM_MLM_MODELS:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    restart: unless-stopped
    volumes:
      - ./models:/root/.cache  # Cache models between restarts
