version: '3.8'

services:
  caveman-compression:
    build:
      context: .
      args:
        LANGUAGES: en,fr
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - LANGUAGES=en,fr
    volumes:
      - ./hf-cache:/app/.cache/huggingface
      - ./spacy-cache:/app/.cache/spacy
      - ./models:/app/models
    restart: unless-stopped
    volumes:
      - ./models:/root/.cache  # Cache models between restarts
