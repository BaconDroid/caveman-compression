version: '3.8'

services:
  caveman-compression:
    build:
      context: .
      args:
        LANGUAGES: en,fr
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - LANGUAGES=en,fr
    volumes:
      # NOTE: Create these directories BEFORE first `docker compose up` and
      # ensure they are writable by UID 10001 (the container's appuser):
      #   mkdir -p hf-cache spacy-cache models && chown 10001:10001 hf-cache spacy-cache models
      - ./hf-cache:/app/.cache/huggingface
      - ./spacy-cache:/app/.cache/spacy
      - ./models:/app/models
    restart: unless-stopped
    volumes:
      - ./models:/root/.cache  # Cache models between restarts
