version: '3.8'

services:
  caveman-compression:
    build: .
    container_name: caveman-compression
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Languages to download models for (comma-separated)
      # Default: "en,fr" (RoBERTa + CamemBERT)
      - LANGUAGES=en,fr
      
      # Custom MLM models (optional)
      # Format: "lang:huggingface-model,lang:huggingface-model"
      # Example: "de:bert-base-german-cased,es:dccuchile/bert-base-spanish-wwm-cased"
      # - CUSTOM_MLM_MODELS=de:bert-base-german-cased
      
      # Custom spaCy models (optional)
      # Format: "lang:spacy-model,lang:spacy-model"
      # Example: "de:de_core_news_sm,es:es_core_news_sm"
      # - CUSTOM_SPACY_MODELS=de:de_core_news_sm
    restart: unless-stopped
    volumes:
      # Cache models between restarts
      - ./models:/root/.cache
