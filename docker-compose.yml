version: '3.8'

services:
  caveman-compression:
    build: .
    container_name: caveman-compression
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Languages to download models for (comma-separated)
      # Default: "en,fr" (RoBERTa + CamemBERT)
      - LANGUAGES=en,fr
    restart: unless-stopped
    volumes:
      - ./models:/root/.cache  # Cache models between restarts
